; Garage Horizon Auto — OPcache production
; back.md section 12 : "OPcache active, validate_timestamps=0 en production, reinitialise au deploiement"

opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
; Les fichiers ne sont jamais revalides en production : le cache est purge
; explicitement lors du deploiement (cache:clear), pas par horodatage.
opcache.validate_timestamps=0
opcache.save_comments=1
opcache.preload_user=www-data
