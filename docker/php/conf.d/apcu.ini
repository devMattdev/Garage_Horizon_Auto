; Garage Horizon Auto — APCu
; back.md section 3 : "adaptateur APCu pour les metadonnees" (cache systeme Symfony,
; cache de metadonnees/requetes Doctrine, voir config/packages/cache.yaml et doctrine.yaml).
;
; Desactive en CLI : chaque commande console est un processus isole, un cache
; APCu n'y survivrait pas d'un appel a l'autre. Symfony detecte automatiquement
; cette configuration et bascule sur un cache fichiers pour les commandes console.
;
; L'extension elle-meme est deja activee par `docker-php-ext-enable apcu`
; (docker/php/Dockerfile, stage "base") ; ce fichier ne fait que la configurer.
apc.enabled=1
apc.enable_cli=0
apc.shm_size=32M
