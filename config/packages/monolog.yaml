monolog:
    channels: # To see all channels, run bin/console debug:autowiring logger
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
        - audit # back.md section 17 : accès et modifications sur les demandes, connexions

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            # back.md section 17 : un fichier par canal, pour permettre des durées de
            # rétention différenciées (app 30 j, security/audit 12 mois, deprecation 7 j)
            # via une rotation logrotate quotidienne sur le VPS — voir
            # docker/logrotate/garage-horizon-auto.example.
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!deprecation", "!security", "!audit"]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            nested:
                type: stream
                path: '%kernel.logs_dir%/app.log'
                level: debug
                formatter: monolog.formatter.json
            security:
                type: stream
                path: '%kernel.logs_dir%/security.log'
                level: debug
                channels: [security]
                formatter: monolog.formatter.json
            audit:
                type: stream
                path: '%kernel.logs_dir%/audit.log'
                level: debug
                channels: [audit]
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: '%kernel.logs_dir%/deprecation.log'
                formatter: monolog.formatter.json
