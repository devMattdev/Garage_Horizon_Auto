framework:
    messenger:
        failure_transport: failed

        transports:
            async: '%env(MESSENGER_TRANSPORT_DSN)%'
            failed: 'doctrine://default?queue_name=failed'
            sync: 'sync://'

        routing:
            App\Message\DemandeRecueMessage: async
            App\Message\RappelRendezVousMessage: async
            App\Message\PurgeRgpdMessage: async
            App\Message\RetraitVehiculesVendusMessage: async
            App\Message\AlerteFichesObsoletesMessage: async
            App\Message\RegenerationSitemapMessage: async
            App\Message\GenererVariantesPhotoVehiculeMessage: async

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
